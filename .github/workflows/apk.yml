# Automatyczne testy (GUT) i budowa APK (debug) po każdym wypchnięciu na main.
# Gotowy plik: zakładka Actions -> ostatnie uruchomienie -> Artifacts -> hufduhof-apk.
name: Testy i APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Przygotowanie szablonów eksportu
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import zasobów
        run: godot --headless --path . --import || true
      - name: Testy GUT
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json
      - name: Eksport APK (debug)
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/hufduhof.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: hufduhof-apk
          path: build/hufduhof.apk
